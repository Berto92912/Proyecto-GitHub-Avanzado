name: Comparar DEV_TOKEN

on:
  push:

jobs:
  comparar-tokens:
    runs-on: self-hosted

    steps:
      - name: Comprobar variable local
        shell: powershell
        run: |
          if ([string]::IsNullOrEmpty($env:LOCAL_DEV_TOKEN)) {
            Write-Host "LOCAL_DEV_TOKEN NO está disponible"
            exit 1
          } else {
            Write-Host "LOCAL_DEV_TOKEN está disponible"
          }

      - name: Comparar tokens
        shell: powershell
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          if ($env:DEV_TOKEN -eq $env:LOCAL_DEV_TOKEN) {
            Write-Host "Los tokens coinciden"
          } else {
            Write-Host "Los tokens NO coinciden"
            exit 1
          }

            Write-Host "Los tokens coinciden"
          } else {
            Write-Host "Los tokens NO coinciden"
          }
